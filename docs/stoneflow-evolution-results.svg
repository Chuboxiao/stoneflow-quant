<text x="48" y="779" font-size="24" fill="#294137" text-anchor="start" font-weight="600" class="num">为何只留一个？</text>
<text x="48" y="816" font-size="23" fill="#294137" text-anchor="start" font-weight="400" class="num">10日低波动的单因子 IC 更高，但替换后组合没有增量，仍然淘汰。</text>
<text x="48" y="858" font-size="21" fill="#a65c3e" text-anchor="start" font-weight="400" class="num">平均 IC 提高，验证正 IC 月份减少；回顾收益差仍为负，尚未证明更赚钱。</text>
<text x="48" y="886" font-size="18" fill="#647267" text-anchor="start" font-weight="400" class="num">2026 历史此前已查看，属于回顾而非新盲测；报价收益未扣费，未完成净交易验证。</text>
