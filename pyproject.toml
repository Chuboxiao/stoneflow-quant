[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stoneflow-quant"
version = "0.1.0"
description = "面向课程的日频、事件驱动、复权单位回测系统"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<4", "pyarrow>=16"]

[project.scripts]
stoneflow-backtest = "backtest.cli:main"

[tool.setuptools.packages.find]
include = ["backtest*"]
